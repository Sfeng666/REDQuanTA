# REDQuanTEA conda environment
# Replication-Enhanced Detection of Quantitative Traits Evolving Adaptively
#
#   conda env create -f environment.yml
#   conda activate redquantea

name: redquantea
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.9
  - snakemake>=8.0
  - pandas>=2.0
  - r-base>=4.3
  - r-abc>=2.2
  - r-ggplot2>=3.5
  - r-viridis>=0.6
  - r-cowplot>=1.2
  - r-reshape2>=1.4
  - r-e1071>=1.7
  - r-data.table>=1.14
  - r-scales>=1.3
